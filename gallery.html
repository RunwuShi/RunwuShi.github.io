    <link rel="apple-touch-icon" href="assets/favicon.png" />

  <body>
    <header class="site-header">
      <div class="header-inner">
        <nav class="nav" aria-label="Primary navigation">
          <a href="index.html#top">Home</a>
          <a href="index.html#about">About Me</a>
          <a href="index.html#news">News</a>
          <a href="index.html#education">Education</a>
          <a href="index.html#projects">Project</a>
          <a href="index.html#publications">Publication</a>
          <a href="gallery.html" aria-current="page">Gallery</a>
        </nav>
        <div class="header-actions">
          <button
            class="icon-button"
            id="theme-toggle"
            type="button"
            aria-label="Switch to dark mode"
            title="Switch to dark mode"
          >
            <svg class="moon-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M21 14.7A8.5 8.5 0 0 1 9.3 3a7 7 0 1 0 11.7 11.7Z" />
            </svg>
            <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
          </button>
          <button class="language-button" id="language-toggle" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6" />
            </svg>
            <span class="lang-en">中文</span>
            <span class="lang-zh">English</span>
          </button>
        </div>
      </div>
    </header>

    <main id="top" class="page gallery-page">
      <article class="content gallery-content">
        <section id="gallery">
          <h2><span class="lang-en">Gallery</span><span class="lang-zh">画廊</span></h2>
          <p class="gallery-intro">
            <span class="lang-en">I like digital painting, especially science fiction and related themes.</span>
            <span class="lang-zh">我喜欢数字绘画，比如科幻等主题。</span>
          </p>
          <div class="gallery-list">
            <figure class="gallery-item">
              <img
                class="gallery-artwork"
                src="assets/gallery/runwu-shi-painting-2018-preview.jpg"
                alt="Painting created by Runwu Shi in 2018"
                width="1800"
                height="919"
              />
              <figcaption class="gallery-caption">
                <span class="lang-en">Created in 2018</span>
                <span class="lang-zh">创作于 2018</span>
                <a href="assets/gallery/runwu-shi-painting-2018.jpeg" download>
                  <span class="lang-en">Download</span><span class="lang-zh">下载原图</span>
                </a>
              </figcaption>
            </figure>

            <figure class="gallery-item portrait-item">
              <img
                class="gallery-artwork"
                src="assets/gallery/runwu-shi-painting-2019-preview.jpg"
                alt="Painting created by Runwu Shi in 2019"
                width="1000"
                height="1500"
                loading="lazy"
              />
              <figcaption class="gallery-caption">
                <span class="lang-en">Created in 2019</span>
                <span class="lang-zh">创作于 2019</span>
                <a href="assets/gallery/runwu-shi-painting-2019.png" download>
                  <span class="lang-en">Download</span><span class="lang-zh">下载原图</span>
                </a>
              </figcaption>
            </figure>
          </div>
        </section>

        <footer>Last updated 2026.</footer>
      </article>
    </main>

    <script src="script.js"></script>
  </body>
</html>
